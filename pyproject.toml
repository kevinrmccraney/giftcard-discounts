[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giftcard-discounts-prototype"
version = "0.1.0"
description = "Local snapshot pipeline and Safari Web Extension prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["giftcard_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
